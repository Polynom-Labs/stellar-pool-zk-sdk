name: NPM Package bump version

on:
  workflow_dispatch:
  push:
    branches:
      - "development"
      - "main"
    paths:
      - "client-sdk/**/*"
      - "ptau/**"
      - "shapes.json"
      - "scripts/generate-circuit-main.sh"
      - ".gitmodules"
      - "soroban-privacy-pools"
      - ".github/workflows/npm-bump-version.yaml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"
      - uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: "v0.15.0"
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: "Build client-sdk"
        run: cd client-sdk && npm i --no-frozen-lockfile && npm run build
      - name: Verify SDK package omits proving artifacts
        run: |
          set -euo pipefail
          pack_dir="$(mktemp -d)"
          (cd client-sdk && npm pack --pack-destination "$pack_dir")
          tarball="$(find "$pack_dir" -name '*.tgz' | head -n 1)"
          test -n "$tarball"
          if tar -tf "$tarball" | grep -E '\.(zkey|r1cs|bin|gz)$|_verification_key\.json$'; then
            echo "SDK package must not include proving or verification artifacts" >&2
            tar -tf "$tarball" >&2
            exit 1
          fi

  bump-version:
    permissions:
      contents: write
      id-token: write
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"
      - name: "Automated Version Bump"
        uses: "phips28/gh-action-bump-version@master"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGEJSON_DIR: "client-sdk"
        with:
          tag-prefix: "v"
          rc-wording:
          default: prerelease
          preid: rc
